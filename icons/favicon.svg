<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching Dewi brand colors -->
    <linearGradient id="dewiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7300"/>
      <stop offset="50%" stop-color="#ff4500"/>
      <stop offset="100%" stop-color="#d63000"/>
    </linearGradient>

    <!-- Subtle inner highlight -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft drop shadow for text -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#dewiGradient)"/>
  
  <!-- Subtle top highlight overlay -->
  <rect x="20" y="20" width="472" height="236" rx="116" ry="116" fill="url(#innerGlow)"/>

  <!-- Border accent -->
  <rect x="18" y="18" width="476" height="476" rx="118" ry="118" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Dewi Brand Wordmark -->
  <text x="50%" y="54%" 
        font-family="'Raleway', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="160" 
        font-weight="900" 
        letter-spacing="-1px"
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="central"
        filter="url(#textShadow)">
    Dewi
  </text>
</svg>
